<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sc.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-pixel"></span>
                cotton candy beats
        
            </div>

            <nav class="nav">
                <button class="nav-item active" data-view="home">
                    <span class="nav-icon">⌕</span> Search
                </button>
                <button class="nav-item" data-view="liked">
                    <span class="nav-icon">♥</span> Liked Songs
                </button>
            </nav>

            <div class="sidebar-playlists">
                <p class="sidebar-label">your berries</p>
                <ul id="playlist-list" class="playlist-list"></ul>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="search-wrap">
                    <input id="search-input" type="text" placeholder="Search for a song" />
                </div>
                <div class="mood-tag" id="mood-tag">faeriebl00d</div>
            </header>

            <section id="view-home" class="view">
                <h1 class="greeting" id="greeting">Goodzz da dayyy</h1>
                <h2 class="section-title">kickback in</h2>
                <div class="quick-grid" id="quick-grid"></div>

                <h2 class="section-title">made for you honeypie!</h2>
                <div class="song-grid" id="song-grid"></div>
            </section>

            <section id="view-liked" class="view hidden">
                <h1 class="greeting">liked songs💗</h1>
                <div class="song-grid" id="liked-grid"></div>
            </section>
        </main>
    </div>

    <footer class="player">
        <div class="player-track">
            <canvas id="cover-canvas" width="8" height="8"></canvas>
            <div class="player-meta">
                <p class="player-title" id="now-title">pick a tune🧜‍♀️</p>
                <p class="player-artist" id="now-artist"></p>
            </div>
            <button id="like-btn" class="like-btn" title="like this song">♡</button>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button id="prev-btn" class="ctrl-btn" aria-label="Previous song">⏮</button>
                <button id="play-btn" class="ctrl-btn play" aria-label="Play or pause">▶</button>
                <button id="next-btn" class="ctrl-btn" aria-label="Next song">⏭</button>
            </div>

            <div class="progress-row">
                <span id="time-current" class="time">0:00</span>
                <div class="progress-track" id="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                    <div class="progress-knob" id="progress-knob"></div>
                </div>
                <span id="time-total" class="time">0:00</span>
            </div>
        </div>

        <div class="player-volume">
            <span class="vol-icon">🔊</span>
            <input id="volume-slider" type="range" min="0" max="100" value="20" />
        </div>
    </footer>

    <script src="sc.js"></script>
</body>
</html>
